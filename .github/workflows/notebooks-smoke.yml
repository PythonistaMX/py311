name: Notebooks Smoke Test

# Ejecuta todos los notebooks completos. Las celdas que muestran un error a propósito
# llevan la etiqueta "raises-exception"; cualquier otro error hace fallar el workflow.
# 26_extraccion_y_almacenamiento descarga un archivo del INEGI, así que se ejecuta
# en un paso aparte que no bloquea si el sitio no responde.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat==5.11.1 nbclient==0.11.0

      - name: Write notebook runner
        run: |
          cat > "$RUNNER_TEMP/ejecutar.py" <<'PY'
          import glob
          import sys

          import nbformat
          from nbclient import NotebookClient
          from nbclient.exceptions import CellExecutionError

          INTERNET = {"26_extraccion_y_almacenamiento.ipynb"}
          if sys.argv[1:] == ["--internet"]:
              NOTEBOOKS = sorted(INTERNET)
          else:
              NOTEBOOKS = [p for p in sorted(glob.glob("[0-9][0-9]_*.ipynb")) if p not in INTERNET]

          fallas = []
          for path in NOTEBOOKS:
              nb = nbformat.read(path, as_version=4)
              try:
                  NotebookClient(nb, timeout=300, kernel_name="python3", allow_errors=False).execute()
                  print(f"[OK] {path}")
              except CellExecutionError as exc:
                  print(f"[FALLA] {path}\n{exc}")
                  fallas.append(path)
          if fallas:
              print("\n[SMOKE] Fallaron:", *fallas, sep="\n  - ")
              sys.exit(1)
          PY

      - name: Verify data files (SHA-256)
        run: python scripts/verificar_datos.py

      - name: Execute notebooks
        run: python "$RUNNER_TEMP/ejecutar.py"

      - name: Execute notebooks that download data
        continue-on-error: true
        run: python "$RUNNER_TEMP/ejecutar.py" --internet
